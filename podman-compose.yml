---
name: local-llm

services:
  core:
    container_name: searxng-core
    # Pinned: build must postdate searxng#6620 (curl_cffi/Chrome-impersonation migration,
    # merged 2026-09-04) — the prior stale "latest" (2026-05-10) had plain httpx egress,
    # JA3-fingerprint blocked by brave/ddg/startpage, and returned zero web-search results.
    image: docker.io/searxng/searxng:2026.11.26-b5605b8f2
    restart: always
    # Loopback-only: SearXNG has no auth; the only client is Open WebUI on the
    # host (localhost). LAN exposure was the "NE High" finding (CWE-923).
    ports:
      - "127.0.0.1:8411:8411"
    environment:
      - SEARXNG_PORT=8411
      # entrypoint.sh chowns the bind-mounted config dir to its "searxng" uid on
      # every start (= host uid 100976 under rootless), stealing ownership of
      # core-config/ from the repo and breaking host-side edits. Disarm: warn only.
      - FORCE_OWNERSHIP=false
    # Live secret (server.secret_key) lives in the git-ignored env file below, not in
    # this repo (sec-review 2026-11-26, CWE-532). The app prefers it over settings.yml.
    env_file:
      - ./core-config/.env
    volumes:
      - ./core-config/:/etc/searxng/:z
      - core-data:/var/cache/searxng/

  open-webui:
    container_name: open-webui
    # Note: Web retrieval is broken in v0.9.5
    image: ghcr.io/open-webui/open-webui:v0.9.4
    restart: always
    network_mode: host
    volumes:
      - owui-data:/app/backend/data:Z
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - SEARXNG_API_URL=http://localhost:8411
      - OPENAI_API_BASE_URL=https://router.huggingface.co/v1

volumes:
  core-data:
  owui-data:
