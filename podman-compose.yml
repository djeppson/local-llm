# Local LLM stack: SearXNG + Open WebUI
# SearXNG docs: https://docs.searxng.org/admin/installation-docker.html
# Open WebUI docs: https://docs.openwebui.com/

name: local-llm

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    environment:
      - SEARXNG_PORT=8411
    ports:
      - "8411:8411"
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.9.5
    restart: always
    network_mode: host
    volumes:
      - /home/jeppson/.local/share/containers/storage/volumes/open-webui/_data:/app/backend/data:Z
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - SEARXNG_API_URL=http://localhost:8411

volumes:
  core-data:
  valkey-data:
