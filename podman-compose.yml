# Local LLM stack: SearXNG + Open WebUI
# SearXNG docs: https://docs.searxng.org/admin/installation-docker.html
# Open WebUI docs: https://docs.openwebui.com/

name: local-llm

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - "0.0.0.0:8411:8411"
    environment:
      - SEARXNG_PORT=8411
    volumes:
      - ./core-config/:/etc/searxng/:z
      - core-data:/var/cache/searxng/

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.9.5
    restart: always
    network_mode: host
    volumes:
      - /home/jeppson/.local/share/containers/storage/volumes/open-webui/_data:/app/backend/data:Z
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      # PersistentConfig - only used at initial setup
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE="searxng"
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL=http://localhost:8411/search?format=json&q=<query>

volumes:
  core-data:
  valkey-data:
